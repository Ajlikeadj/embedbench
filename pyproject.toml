[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedbench"
version = "0.1.0"
description = "Local embedding-model benchmarks for RAG retrieval on your own documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The embedbench authors" }]
keywords = ["embeddings", "rag", "retrieval", "benchmark", "faiss", "ollama", "sentence-transformers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "psutil>=5.9",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
embedbench = "embedbench.cli:main"

[tool.setuptools.packages.find]
include = ["embedbench*"]

[tool.setuptools.package-data]
embedbench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:transformers.*",
  "ignore::DeprecationWarning:sentence_transformers.*",
]

[tool.coverage.run]
source = ["embedbench"]
omit = ["embedbench/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["embedbench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
