# embedbench configuration snapshot
# Generated automatically with every run. Relative paths are cwd-relative.
docs: examples\docs
models:
- hf:BAAI/bge-small-en-v1.5
- hf:all-MiniLM-L6-v2
top_k: 5
seed: 42
output_dir: examples\results_repro
plugins: []
chunking:
  strategy: recursive
  chunk_size: 600
  chunk_overlap: 100
  min_chunk_chars: 80
ingestion:
  extensions:
  - .txt
  - .md
  - .pdf
  - .docx
  - .html
  recursive: true
  max_file_bytes: 20000000
  skip_dirs:
  - .git
  - .hg
  - .svn
  - .venv
  - venv
  - node_modules
  - __pycache__
  - .embedbench_cache
evalset:
  path: examples\evalset.jsonl
  auto_generate: false
  ollama_model: llama3.2
  questions_per_chunk: 1
  max_chunks: 30
  min_chunk_chars: 120
  min_question_words: 5
  max_question_words: 40
  dedupe_threshold: 0.85
  max_generation_attempts: 2
  temperature: 0.0
  num_predict: 220
  request_timeout_s: 180.0
backends:
  ollama:
    batch_size: 16
    query_prefix: null
    document_prefix: null
    timeout_s: 120.0
    max_retries: 3
    retry_backoff_s: 0.75
    host: http://localhost:11434
    keep_alive: null
  hf:
    batch_size: 32
    query_prefix: null
    document_prefix: null
    device: auto
    trust_remote_code: false
    cache_folder: null
    local_files_only: false
    max_seq_length: 512
  extra: {}
cache:
  enabled: true
  dir: .embedbench_cache
report:
  title: Embedding models for the Helio knowledge base
  priority: balanced
  cost_per_1m_tokens: 0.02
