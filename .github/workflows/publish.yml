name: Publish

# Publishes to PyPI with Trusted Publishing (OIDC), so no API token is stored in
# the repository. Configure the pending publisher on PyPI first, then either:
#   * publish a GitHub Release (Settings -> Releases -> Publish release), or
#   * run this workflow manually (Actions -> Publish -> Run workflow).
#
# Trusted publisher fields on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name: embedbench
#   Owner:             Ajlikeadj
#   Repository:        embedbench
#   Workflow name:     publish.yml
#   Environment:       pypi        (create it under repo Settings -> Environments)
#
# TestPyPI needs its own pending publisher at https://test.pypi.org/manage/account/publishing/
# with the same fields, plus "Environment: testpypi".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [pypi, testpypi]
        default: pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true
