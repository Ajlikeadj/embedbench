[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embedbench"
dynamic = ["version"]
description = "Benchmark text embedding models for retrieval quality, latency, memory and cost"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The embedbench authors" }]
keywords = [
  "embeddings",
  "rag",
  "retrieval",
  "benchmark",
  "vector-search",
  "ollama",
  "sentence-transformers",
  "openai",
  "cohere",
  "voyage",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "psutil>=5.9",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Local Hugging Face / sentence-transformers models.
local = ["sentence-transformers>=3.0"]
# Optional accelerated exact search; NumPy is used when FAISS is absent.
faiss = ["faiss-cpu>=1.8"]
# Cloud providers: install only the SDK you need.
openai = ["openai>=1.40", "tiktoken>=0.7"]
cohere = ["cohere>=5.5"]
voyage = ["voyageai>=0.3"]
# Document formats that need extra parsers.
docs = ["pypdf>=4.0", "python-docx>=1.1"]
# Comparative plots from reporter.py.
plots = ["matplotlib>=3.8"]
# Everything a benchmark power user might want.
all = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "openai>=1.40",
  "tiktoken>=0.7",
  "cohere>=5.5",
  "voyageai>=0.3",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
embedbench = "embedbench.cli:main"

[project.urls]
Homepage = "https://github.com/embedbench/embedbench"
Documentation = "https://github.com/embedbench/embedbench#readme"
Issues = "https://github.com/embedbench/embedbench/issues"
Repository = "https://github.com/embedbench/embedbench"

[tool.hatch.version]
path = "src/embedbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/embedbench"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "/examples/results",
  "/examples/results_repro",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
  "ignore::DeprecationWarning:transformers.*",
  "ignore::DeprecationWarning:sentence_transformers.*",
]

[tool.coverage.run]
source = ["embedbench"]
omit = ["src/embedbench/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "RUF001", # ambiguous unicode in docstrings is intentional in examples
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["embedbench"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "RUF007", "RUF012", "RUF043"]
"probes/*" = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
